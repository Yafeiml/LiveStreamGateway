name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows x64 Release (with FFmpeg)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Extract Current Version Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $lines = @(Get-Content -LiteralPath "RELEASE_NOTES.md" -Encoding utf8)
          $headingPattern = '^##\s+.*?(?<version>v\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\b'

          $startIndex = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern -and $Matches['version'] -eq $version) {
              $startIndex = $i
              break
            }
          }

          if ($startIndex -lt 0) {
            throw "Release notes section for $version was not found in RELEASE_NOTES.md."
          }

          $endIndex = $lines.Count
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $headingPattern) {
              $endIndex = $i
              break
            }
          }

          $section = [System.Collections.Generic.List[string]]::new()
          for ($i = $startIndex; $i -lt $endIndex; $i++) {
            $section.Add($lines[$i])
          }

          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[$section.Count - 1])) {
            $section.RemoveAt($section.Count - 1)
          }
          if ($section.Count -gt 0 -and $section[$section.Count - 1].Trim() -eq '---') {
            $section.RemoveAt($section.Count - 1)
          }
          while ($section.Count -gt 0 -and [string]::IsNullOrWhiteSpace($section[$section.Count - 1])) {
            $section.RemoveAt($section.Count - 1)
          }

          if ($section.Count -lt 2) {
            throw "Release notes section for $version is empty."
          }

          $outputPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          $body = ($section -join "`n") + "`n"
          [System.IO.File]::WriteAllText($outputPath, $body, [System.Text.UTF8Encoding]::new($false))
          "path=$outputPath" >> $env:GITHUB_OUTPUT
          Write-Host "Extracted $($section.Count) lines for $version."

      - name: Download FFmpeg Essentials
        shell: pwsh
        run: |
          $ffmpegUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zipPath = "$env:RUNNER_TEMP\ffmpeg.zip"
          $extractPath = "$env:RUNNER_TEMP\ffmpeg"
          
          Write-Host "Downloading FFmpeg Essentials..."
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $zipPath -UseBasicParsing
          
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          
          $ffmpegExe = Get-ChildItem $extractPath -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Write-Host "Found: $($ffmpegExe.FullName) ($([math]::Round($ffmpegExe.Length/1MB,1)) MB)"
          
          echo "FFMPEG_PATH=$($ffmpegExe.FullName)" >> $env:GITHUB_ENV

      - name: Publish Single-File Executable
        shell: pwsh
        run: |
          dotnet publish LiveStreamGateway.csproj -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ./out

      - name: Package Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./package | Out-Null
          
          # Copy docs & config
          Copy-Item config.example.json -Destination ./out/config.example.json -Force
          Copy-Item config.example.json -Destination ./out/config.json -Force
          Copy-Item README.md -Destination ./out/README.md -Force
          Copy-Item LICENSE -Destination ./out/LICENSE -Force
          
          # Copy FFmpeg
          Copy-Item $env:FFMPEG_PATH -Destination ./out/ffmpeg.exe -Force
          $sizeMB = [math]::Round((Get-Item ./out/ffmpeg.exe).Length/1MB, 1)
          Write-Host "Bundled ffmpeg.exe ($sizeMB MB)"
          
          # Create zip
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          Compress-Archive -Path ./out/* -DestinationPath "./package/LiveStreamGateway-$ver-win-x64.zip" -Force
          
          $zipSize = [math]::Round((Get-Item "./package/LiveStreamGateway-$ver-win-x64.zip").Length/1MB, 1)
          Write-Host "Package size: $zipSize MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: ${{ steps.release_notes.outputs.path }}
          files: ./package/*
          draft: false
          prerelease: false
          generate_release_notes: false

  build-docker:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
