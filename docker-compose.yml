services:
  live-stream-gateway:
    # 支持本地自动构建，或直接拉取发布的镜像
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/yafeiml/livestreamgateway:latest
    container_name: live-stream-gateway
    restart: unless-stopped
    ports:
      - "9898:9898"
    volumes:
      # 持久化配置文件（保存频道列表与 Cookie 凭据）
      - ./config.json:/app/config.json
    tmpfs:
      # 【重要优化】将切片缓存放入内存盘，彻底杜绝频繁读写损坏 NAS 机械硬盘或 SSD
      # OnDemand 模式下单次最多 2~3 个频道同时推流，512MB 绰绰有余
      - /app/hls_stream:size=512M,mode=1777
    environment:
      - TZ=Asia/Shanghai
      - ASPNETCORE_ENVIRONMENT=Production
    # 【重要】日志轮转：限制 json-file 驱动单文件 50MB、最多保留 3 个文件
    # 避免长期运行后日志文件无限增长占满磁盘
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    # 容器健康检查：每 30s 检查 /api/health；失败会标记 unhealthy，便于面板/监控告警
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:9898/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 内存上限：防止应用层内存泄漏引发 OOM 无限占用（1GB 足以覆盖多频道并发场景）
    deploy:
      resources:
        limits:
          memory: 1G
